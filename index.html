<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<title>CGL plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tailwind palette (slate, teal, sky, indigo, violet, amber, orange, rose, emerald, fuchsia) written as plain CSS */
:root{
  color-scheme:light;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --line:#E2E8F0;
  --text:#0F172A; --text-2:#475569; --text-3:#94A3B8;
  --accent:#0D9488; --accent-2:#0F766E; --accent-weak:#CCFBF1; --on-accent:#FFFFFF;
  --red:#E11D48; --red-weak:#FFE4E6; --sun:#FBBF24;
  --c-quant:#10B981; --c-eng:#6366F1; --c-ga:#F59E0B; --c-rsn:#D946EF; --c-mixed:#94A3B8;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px -14px rgba(15,23,42,.22);
  --shadow-lg:0 2px 4px rgba(15,23,42,.06),0 24px 48px -20px rgba(15,23,42,.35);
  --hero-ink:#fff;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:20px; --r-s:14px; --tab:66px;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#020617; --surface:#0F172A; --surface-2:#1E293B; --line:#1E293B;
  --text:#F1F5F9; --text-2:#CBD5E1; --text-3:#64748B;
  --accent:#2DD4BF; --accent-2:#5EEAD4; --accent-weak:#134E4A; --on-accent:#042F2E;
  --red:#FB7185; --red-weak:#4C0519; --sun:#FCD34D;
  --c-quant:#34D399; --c-eng:#818CF8; --c-ga:#FBBF24; --c-rsn:#E879F9; --c-mixed:#64748B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);
  --shadow-lg:0 24px 48px -20px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 16px);scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 110% -10%,color-mix(in srgb,var(--c-eng) 12%,transparent),transparent 60%),radial-gradient(900px 500px at -20% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
p{margin:0}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.mono{font-family:var(--mono)!important}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--text-3)} .soft{color:var(--text-2)} .small{font-size:14px} .xs{font-size:13px} .red{color:var(--red)}
.hstack{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.clamp2{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.center{text-align:center}

/* shell */
.top{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:6px;max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px 18px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
.top .brand{font-weight:800;font-size:18px;letter-spacing:-.03em;margin-right:auto;display:flex;align-items:center;gap:8px}
.top .brand::before{content:"";width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--c-quant),var(--c-eng),var(--c-rsn),var(--c-ga),var(--c-quant));box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--surface) 80%,transparent)}
.wrap{max-width:680px;margin:0 auto;padding:6px 16px calc(var(--tab) + env(safe-area-inset-bottom) + 28px)}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--text-2);flex:none}
.ibtn:hover{background:var(--surface)}
.saved{font-size:13px;color:var(--text-3);display:inline-flex;align-items:center;gap:6px;padding:0 6px}
.saved::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c-quant);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-quant) 25%,transparent)}
.saved.err{color:var(--red)} .saved.err::before{background:var(--red)}
.saved.saving::before{background:var(--text-3);box-shadow:none}
.tabs{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-radius:22px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.tabs button{height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--text-3);border-radius:18px}
.tabs button[aria-current="page"]{color:var(--accent-2)}
.tabs button[aria-current="page"] svg{background:var(--accent-weak);border-radius:10px;padding:3px;width:34px;height:28px;stroke-width:2.1}
.toptabs{display:none}
.notice{display:flex;align-items:center;gap:10px;background:var(--accent-weak);color:var(--accent-2);border-radius:var(--r-s);padding:10px 12px 10px 14px;font-size:14px;margin:0 0 14px}
.notice span{flex:1}
.notice.err{background:var(--red-weak);color:var(--red)}

/* hero banners: one colour per page, a darker shade per day type */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 18px;margin:4px 0 22px;color:var(--hero-ink);background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 20px 40px -24px var(--h2);--h1:#0D9488;--h2:#0284C7;display:flex;gap:10px;align-items:flex-start}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 90% 0%,rgba(255,255,255,.28),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 22px);pointer-events:none;-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000);mask-image:linear-gradient(120deg,transparent 30%,#000)}
.hero > *{position:relative;z-index:1}
.hero-t{flex:1;min-width:0}
.hero .eyebrow{font-size:14px;font-weight:700;opacity:.85}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-.035em;margin-top:2px}
.hero-s{font-size:15px;opacity:.9;margin-top:4px}
.hero-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hart{width:120px;flex:none;margin:-4px -6px -6px 0;filter:drop-shadow(0 14px 16px rgba(0,0,0,.18))}
.hero .ibtn{color:#fff;background:rgba(255,255,255,.16)} .hero .ibtn:hover{background:rgba(255,255,255,.26)}
.hero.p-week{--h1:#0D9488;--h2:#4F46E5}
.hero.p-tests{--h1:#4F46E5;--h2:#C026D3}
.hero.p-review{--h1:#E11D48;--h2:#F97316}
.hero.p-progress{--h1:#059669;--h2:#0891B2}
.hero.d-easy{--h1:#14B8A6;--h2:#0284C7}
.hero.d-moderate{--h1:#0EA5E9;--h2:#4F46E5}
.hero.d-hard{--h1:#6366F1;--h2:#7C3AED}
.hero.d-mock{--h1:#F59E0B;--h2:#EA580C}
.hero.d-repair{--h1:#F43F5E;--h2:#C026D3}
.hero.d-none{--h1:#64748B;--h2:#334155}
@media (prefers-color-scheme: dark){.hero{filter:saturate(.9) brightness(.86)}}
.btn.white{background:#fff;color:#0F172A} .btn.white:hover{background:#F1F5F9}
.btn.ghostw{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)} .btn.ghostw:hover{background:rgba(255,255,255,.26)}

/* Today hero */
.dayhero{flex-direction:column;align-items:stretch;gap:0}
.dh-row{display:flex;align-items:flex-start;gap:6px}
.dh-row .t{flex:1;min-width:0}
.dh-row h1{font-size:30px}
.dh-row .sub{font-size:15px;opacity:.9;margin-top:2px}
.dh-body{display:flex;align-items:flex-end;gap:10px;margin-top:14px}
.size{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);border-radius:18px;padding:10px 12px;color:#fff;text-align:left}
.size:hover:not([disabled]){background:rgba(255,255,255,.24)}
.size .l{flex:1;min-width:0}
.size b{display:block;font-size:17px}
.size small{font-size:13.5px;opacity:.9}
.size .chev{opacity:.8}
.ring{width:44px;height:44px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:rgba(255,255,255,.3)} .ring .fg{stroke:#fff;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.cubes{width:96px;flex:none;margin:-30px -4px -8px 0;filter:drop-shadow(0 16px 18px rgba(0,0,0,.22))}
.addfab{background:#fff!important;color:#0F172A!important}

/* task groups */
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:center;gap:8px;margin:0 6px 8px;font-size:15px;font-weight:800;color:var(--text)}
.grp-h .gi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--g,var(--accent-weak));color:#fff}
.grp-h .gi svg{width:17px;height:17px}
.grp-h .m{margin-left:auto;font-weight:700;color:var(--text-3);font-size:14px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.task{display:flex;align-items:flex-start;width:100%;min-height:64px;position:relative}
.task + .task::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;background:var(--line)}
.task::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--sc,transparent)}
.chk{width:60px;min-height:64px;display:grid;place-items:center;flex:none}
.chk span{width:27px;height:27px;border-radius:50%;border:2px solid var(--text-3);transition:background-color .15s,border-color .15s;display:grid;place-items:center}
.chk:hover span{border-color:var(--accent)}
.chk svg{width:16px;height:16px;stroke:var(--on-accent);stroke-width:3;fill:none;opacity:0}
.task.done .chk span{background:linear-gradient(135deg,var(--c-quant),var(--accent));border-color:transparent}
.task.done .chk svg{opacity:1}
.task.partial .chk span{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.task.skipped .chk span{border-style:dashed}
.body{flex:1;min-width:0;padding:13px 16px 13px 0;display:block;width:100%}
.body .t{display:block;font-size:16.5px;font-weight:700;line-height:1.35}
.task.done .t,.task.skipped .t{color:var(--text-3)}
.task.skipped .t{text-decoration:line-through}
.body .topic{display:inline-flex;margin-top:5px;font-size:13px;font-weight:800;color:var(--sc,var(--accent-2));background:color-mix(in srgb,var(--sc,var(--accent)) 14%,transparent);border-radius:8px;padding:1px 8px}
.body .step{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;color:var(--text-2);margin-top:5px;line-height:1.45}
.task.done .step{display:none}
.body .m{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:5px;font-size:13.5px;color:var(--text-3)}
.body .m .must{color:var(--accent-2);font-weight:800}
.body .m .mist{color:var(--red);font-weight:800}
.body .m .note{color:var(--text-2)}
.locked .chk{pointer-events:none;opacity:.5}
.hint{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 14px 14px 16px;margin-bottom:12px;font-size:15px}
.hint span{flex:1}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;color:var(--text-2);font-size:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.eart{width:120px;height:90px;display:block;margin:0 auto 8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-s);font-weight:800;font-size:15.5px;background:var(--surface);color:var(--text);white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:hover{background:var(--surface-2)}
.btn.main{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--c-eng)));color:var(--on-accent);box-shadow:0 10px 20px -12px var(--accent)}
.btn.main:hover{filter:brightness(1.05)}
.btn.line{background:transparent}
.btn.red{color:var(--red)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.link{color:var(--accent-2);font-weight:800;min-height:40px;padding:0 8px;border-radius:10px;display:inline-flex;align-items:center;gap:4px}
.link svg.i{width:18px;height:18px}
.link:hover{background:var(--accent-weak)}

/* generic sections */
.page-h{margin:10px 0 18px;display:flex;align-items:center;gap:8px}
.page-h h1{font-size:28px;font-weight:800;letter-spacing:-.035em;flex:1;min-width:0}
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 6px 10px;min-height:40px}
.sec-h h2{font-size:19px;font-weight:800;flex:1}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;min-height:60px;position:relative;text-align:left}
.item + .item::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
button.item:hover{background:var(--surface-2)}
.item .lead{min-width:58px;font-weight:800;font-size:15px}
.item .lead.red{color:var(--red)}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:700;font-size:16px;line-height:1.35}
.item .mid > span{display:block;font-size:14px;color:var(--text-3);margin-top:2px}
.item .end{color:var(--text-3);font-size:13.5px;text-align:right;white-space:nowrap}
.item .end b{display:block;color:var(--text);font-size:16px}
.item.today .lead{color:var(--accent)}
.item.sel{background:color-mix(in srgb,var(--accent-weak) 60%,var(--surface))}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--c-eng));border-radius:6px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nums > div{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px}
.nums b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.nums span{font-size:13px;color:var(--text-3)}
.hero .nums{margin-top:14px} .hero .nums > div{background:rgba(255,255,255,.16);border:0;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)} .hero .nums span{color:#fff;opacity:.85} .hero .nums .muted{color:#fff;opacity:.7}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:800;font-size:14.5px;color:var(--text-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent-2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14.5px;color:var(--text-2)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.pill.red{background:var(--red-weak);color:var(--red);border-color:transparent} .pill.acc{background:var(--accent-weak);color:var(--accent-2);border-color:transparent}
.schip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.schip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
details.more{margin-top:10px}
details.more summary{list-style:none;cursor:pointer;color:var(--accent-2);font-weight:800;font-size:15px;padding:10px 6px;min-height:44px;display:flex;align-items:center;gap:6px}
details.more summary::before{content:"";width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.more[open] summary::before{transform:rotate(45deg)}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td,th{padding:11px 16px;text-align:left;border-top:1px solid var(--line)}
th{font-size:13px;color:var(--text-3);font-weight:800;border-top:0}
td.r,th.r{text-align:right}
.tscroll{overflow-x:auto}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.item.sub{align-items:center}
.hb{position:relative;display:block!important;height:9px;border-radius:6px;margin-top:8px!important;overflow:hidden;background:var(--surface-2)}
.hb i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;display:block}
.hb i.goal{width:2px;background:var(--text);border-radius:0;opacity:.6}

/* OMR + ticks + charts */
.omr{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;padding:16px}
.omr h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between}
.omr h3 span{color:var(--text-3);font-weight:700;font-size:13px}
.og{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ob{aspect-ratio:1;width:100%;max-width:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;border:2px solid var(--text-3);color:var(--text-2);justify-self:center}
.ob.R{background:var(--c-quant);border-color:var(--c-quant);color:#fff}
.ob.W{background:var(--red);border-color:var(--red);color:#fff}
.ob.S{border-style:dashed;color:var(--text-3)}
.ob[aria-pressed="true"]{outline:3px solid var(--text);outline-offset:2px}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-2);padding:0 16px 14px}
.key i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--text-3)}
.key i.R{background:var(--c-quant);border-color:var(--c-quant)} .key i.W{background:var(--red);border-color:var(--red)} .key i.S{border-style:dashed}
.ticks{display:flex;gap:4px}
.tick{width:28px;height:28px;border-radius:8px;font-size:11.5px;font-weight:800;color:var(--text-3);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center}
.tick[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}

.field select[disabled]{opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three .btn{padding:0 8px;white-space:normal;line-height:1.2;font-size:14.5px;text-align:center}
.energy{display:flex;gap:8px}
.energy button{flex:1;height:48px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:800;color:var(--text-2);text-align:center}
.energy button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.check{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:15px;margin-bottom:14px;cursor:pointer}
.check.flat{background:transparent;border:0;padding:4px 0}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:1px 0 0;flex:none}
.steps{margin:0 0 12px;padding:0;list-style:none;counter-reset:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.steps li{counter-increment:s;position:relative;padding:12px 16px 12px 52px;font-size:15.5px;line-height:1.45}
.steps li + li{border-top:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:14px;top:11px;width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--c-eng));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.donewhen{font-size:15px;color:var(--text-2);margin:0 6px 16px}
.donewhen b{color:var(--text);margin-right:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 22px);z-index:70;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:10px;align-items:center;font-size:14.5px;font-weight:700;max-width:calc(100vw - 24px);animation:fade .15s ease;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast button{pointer-events:auto;color:var(--sun);font-weight:800;min-height:36px;padding:0 10px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* laptop */
@media (min-width:900px){
  .tabs{display:none}
  .top{max-width:1120px;padding:16px 28px 10px}
  .toptabs{display:flex;gap:4px;margin-right:auto;margin-left:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
  .toptabs button{min-height:38px;padding:0 16px;border-radius:10px;font-weight:800;color:var(--text-2)}
  .toptabs button:hover{color:var(--text)}
  .toptabs button[aria-current="page"]{background:var(--text);color:var(--bg)}
  .top .brand{margin-right:0}
  .wrap{max-width:1120px;padding:8px 28px 48px}
  .today-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
  .today-side{position:sticky;top:76px}
  .single{max-width:780px;margin:0 auto}
  .sgrid{grid-template-columns:1fr 1fr}
  .hero{padding:26px 26px 22px} .hero h1{font-size:38px} .hart{width:150px} .cubes{width:118px}
  .scrim{align-items:center}
  .sheet{border-radius:26px;padding:22px 24px 24px}
  .sheet .grab{display:none}
  .toast{bottom:24px}
  .omr{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:899px){ .today-side{display:none} }
@media (max-width:599px){ .two.m1{grid-template-columns:1fr;gap:0} }
@media (max-width:380px){ .two{grid-template-columns:1fr} .wrap{padding-left:12px;padding-right:12px} .hart{width:90px} .cubes{width:80px} }
/* popups: tidy scrollbar, pinned buttons, page behind stays still */
body.sheet-open{overflow:hidden}
.sheet{--px:18px;--pb:calc(20px + env(safe-area-inset-bottom));padding:8px var(--px) var(--pb);scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text-3) 55%,transparent) transparent;overscroll-behavior:contain}
.sheet::-webkit-scrollbar{width:12px}
.sheet::-webkit-scrollbar-track{background:transparent;margin:28px 0}
.sheet::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text-3) 50%,transparent);border-radius:12px;border:4px solid transparent;background-clip:padding-box}
.sheet::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--text-3) 80%,transparent)}
.sheet .acts{flex-wrap:wrap;position:sticky;bottom:calc(-1 * var(--pb));z-index:2;margin:18px calc(-1 * var(--px)) calc(-1 * var(--pb));padding:14px var(--px) var(--pb);background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 14px)}
@media (min-width:900px){ .sheet{--px:24px;--pb:24px;padding-top:22px} }
.sheet .acts .btn{flex:1 1 150px}

/* ================= Review: revision + mistakes ================= */

    ${soon.length ? `<details class="more"><summary>Coming up, ${soon.length}</summary>${(() => { const m = moreList("revsoon", soon, 6); return `<div class="card">${m.items.map(x => `<div class="item"><span class="mid"><b>${esc(tn(x.tid))}</b><span>Step ${x.step + 1} of 5</span></span><span class="end">${fmtD(x.due)}</span></div>`).join("")}${m.btn}</div>`; })()}</details>` : ""}</section>`;

  const mrow = m => `<button class="item" data-a="mistsheet" data-id="${m.id}"><span class="lead red num">${m.q ? "Q" + m.q : "Test"}</span><span class="mid"><b>${esc(m.sub || tn(m.topicId))}</b><span>${esc(tn(m.topicId))}</span></span><span class="end num">${m.closed ? "Fixed" : `${m.retries.length}/3`}</span></button>`;

  const wq = wrongQs().length;

  const rh = `<section class="hero p-review"><div class="hero-t"><p class="eyebrow">Revision and mistakes</p><h1>Review</h1><div class="nums"><div><b class="num">${due.length}</b><span>Revision due</span></div><div><b class="num">${open.length}</b><span>Open mistakes</span></div><div><b class="num">${wq}</b><span>Quiz wrongs</span></div></div></div></section>`;

/* ================= Progress ================= */
function mockChart() {
  const total = S().weeks, W = 420, H = 190, L = 30, R = 10, T = 16, B = 24;
  const x = w => L + (w / total) * (W - L - R), y = s => T + (1 - s / 200) * (H - T - B);
  let g = "";
  for (const s of [0, 100, 200]) g += `<line x1="${L}" x2="${W - R}" y1="${y(s)}" y2="${y(s)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(s) + 4}" text-anchor="end">${s}</text>`;
  for (let w = 0; w <= total; w += 4) g += `<text x="${x(w)}" y="${H - 6}" text-anchor="middle">W${w}</text>`;
  const ms = milestones(total);
  g += `<path d="M${x(0)} ${y(72)} ${ms.map(m => `L${x(m.w)} ${y(m.score)}`).join(" ")}" fill="none" stroke="var(--text-3)" stroke-width="1.5" stroke-dasharray="4 5"/>`;
  ms.forEach(m => { g += `<text x="${x(m.w)}" y="${y(m.score) - 8}" text-anchor="middle">${m.score}</text>`; });
  g += `<circle cx="${x(0)}" cy="${y(72)}" r="4.5" fill="var(--red)"/>`;
  const pts = state.mocks.filter(m => m.type !== "t2").map(m => ({ w: weekOfDate(m.date), s: mockScore(m).score })).filter(p => p.w != null).sort((a, b) => a.w - b.w);
  if (pts.length) { g += `<path d="${pts.map((p, i) => (i ? "L" : "M") + x(p.w) + " " + y(p.s)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`; pts.forEach(p => { g += `<circle cx="${x(p.w)}" cy="${y(p.s)}" r="4.5" fill="var(--accent)"/>`; }); }
  return `<div class="chart" style="padding:6px 8px 0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Test scores against goals">${g}</svg></div>`;
}
function quizAccuracy() {
  const by = {}; for (const z of state.quizzes || []) { const k = SEC[z.subj] && z.subj !== "mixed" ? z.subj : null; if (!k) continue; (by[k] ||= { c: 0, a: 0, n: 0 }); by[k].c += z.c; by[k].a += z.c + z.w; by[k].n++; }
  if (!Object.keys(by).length) return "";
  return `<section class="sec"><div class="sec-h"><h2>Quiz accuracy</h2><span class="muted small">Goal 85%</span></div><div class="card">${SECS.filter(k => by[k]).map(k => { const p = by[k].a ? Math.round(by[k].c / by[k].a * 100) : 0; return `<div class="item sub"><span class="sw" style="background:var(--c-${k})"></span><span class="mid"><b>${SEC[k].n}</b><span class="hb"><i style="width:100%;background:var(--line)"></i><i style="width:${p}%;background:var(--c-${k})"></i><i class="goal" style="left:85%"></i></span></span><span class="end num"><b>${p}%</b>${plural(by[k].n, "quiz", "quizzes")}</span></div>`; }).join("")}</div></section>`;
}
function viewProgress() {
  const t1 = state.mocks.filter(m => m.type !== "t2").sort((a, b) => b.date.localeCompare(a.date));
  const last = t1[0] ? mockScore(t1[0]) : null, best = t1.map(m => mockScore(m).score).sort((a, b) => b - a)[0];

</section>`;

    <div class="card tscroll"><table><thead><tr><th></th><th class="r">Done</th><th class="r">Goal</th><th></th></tr></thead><tbody>
    ${rowT("Study hours", +hrs(ws.mins), Math.round((isLight(w) ? 17 : 22.5) * av * 10) / 10)}${rowT("Quant questions", ws.q.quant, sc(T.q.quant))}${rowT("English questions", ws.q.eng, sc(T.q.eng))}${rowT("GA questions", ws.q.ga, sc(T.q.ga))}${rowT("Reasoning questions", ws.q.rsn, sc(T.q.rsn))}${rowT("Revision hours", +hrs(ws.revMin), Math.round(T.rev * av * 10) / 10)}${rowT("Mistakes fixed", ws.closed, T.closed)}
    </tbody></table></div>
    <details class="more"><summary>More goals for this phase</summary><div class="card"><div class="item"><span class="mid"><b>Saturday test</b></span><span class="end">${T.test}</span></div><div class="item"><span class="mid"><b>Time per question</b></span><span class="end">${T.sec} seconds</span></div><div class="item"><span class="mid"><b>Accuracy on new questions</b></span><span class="end">${T.acc}%</span></div><div class="item"><span class="mid"><b>Retention check, every 14 days</b></span><span class="end">${T.ret}%</span></div></div>
    <p class="xs muted" style="margin:8px 4px 0">Busy on busy days and normal on normal days counts as a good week. Days off lower the goals.</p></details></section>`;

  const all = Object.values(TOPICS).filter(t => !t.oos);

      <span class="ticks">${[["L", "Learned"], ["P", "Practised"], ["R", "Revised"], ["T", "Timed"]].map(([k, n]) => `<button class="tick" data-a="tick" data-id="${t.id}" data-k="${k}" aria-pressed="${!!c[k]}" aria-label="${n}" title="${n}">${k}</button>`).join("")}</span></div>`;

  const cov = `<section class="sec"><div class="sec-h"><h2>Syllabus coverage</h2></div><div class="card">${covRows}</div>

    <div class="chips">${[["all", "All"], ...SECS.map(k => [k, SEC[k].n])].map(([k, n]) => `<button class="chip" data-a="tsec" data-k="${k}" aria-pressed="${ui.topicSec === k}">${n}</button>`).join("")}</div>
    <div class="card">${tlist}${tm.btn}</div></details></section>`;

  const sel = ui.omrSel ? PAPER[ui.omrSel - 1] : null;
  const paper = `<section class="sec"><div class="sec-h"><h2>Your CGL 2026 paper</h2></div><div class="card">
    <div class="item"><span class="mid"><b class="num">72 of 200</b><span>46 right, 40 wrong, 14 skipped. 13 Oct, Shift 2</span></span></div></div>

    <div class="omr">${PAPER_ORDER.map(k => { const qs = PAPER.filter(p => p.sec === k), r = qs.filter(p => p.r === "R").length, wr = qs.filter(p => p.r === "W").length; return `<div><h3>${SEC[k].n}<span class="num">${r * 2 - wr * 0.5} marks</span></h3><div class="og">${qs.map(p => `<button class="ob ${p.r}" data-a="omr" data-q="${p.q}" aria-pressed="${ui.omrSel === p.q}" aria-label="Q${p.q}">${p.q}</button>`).join("")}</div></div>`; }).join("")}</div>

    </details></section>`;

  const total = S().weeks, blocks = [];

function normJson(o) {
  if (!o || typeof o !== "object") return null;
  const q = o.question || o.q || o.text || o.prompt; let opts = o.options || o.choices || o.opts;
  if (opts && !Array.isArray(opts)) opts = ["A", "B", "C", "D", "E"].map(k => opts[k] ?? opts[k.toLowerCase()]).filter(v => v != null);
  if (!q || !opts || opts.length < 2) return null;
  opts = opts.map(x => String(typeof x === "object" ? (x.text || x.option || "") : x).replace(/^\(?[A-Da-d][\)\.:]\s*/, ""));
  let a = o.answer ?? o.correct ?? o.ans ?? o.correctAnswer ?? o.correct_option, ans = null;
  if (typeof a === "number") ans = a === opts.length ? a - 1 : a;
  else if (typeof a === "string") { const s = a.trim(); const m = s.match(/^\(?([A-Ea-e])\)?(?:[\s\.\):]|$)/); if (m) ans = m[1].toUpperCase().charCodeAt(0) - 65; else { const i = opts.findIndex(x => x.trim().toLowerCase() === s.toLowerCase()); if (i >= 0) ans = i; } }
  return { q: String(q).trim(), opts, ans: ans != null && ans >= 0 && ans < opts.length ? ans : null, exp: String(o.explanation || o.solution || o.reason || "").trim() };
}
function parseQuestions(raw) {
  let text = String(raw || "").replace(/\r/g, "").trim();

  if (id === "f-subj") { ui.fsubj = e.target.value; const keep = { no: document.getElementById("f-no").value, name: document.getElementById("f-name").value }; render(); document.getElementById("f-no").value = keep.no; document.getElementById("f-name").value = keep.name; }
  if (id === "f-exam") { document.getElementById("f-neg").value = EXAM_NEG[e.target.value]; }
  if (id === "scfile") {
    const f = e.target.files[0]; if (!f) return; e.target.value = "";
    try { snapshot("Importing from StudyCommand"); const r = importStudyCommand(readStudyCommandFile(await f.text()));
      logChange(`Imported ${plural(r.nq, "question")} in ${plural(r.ns, "set")} from StudyCommand`, f.name);
      toast(`Imported ${plural(r.ns, "set")} and ${plural(r.nq, "question")}${r.skipped ? `. ${r.skipped} skipped` : ""}. Check each set’s topic`); commit(); }
    catch (err) { toast(err.message || "Couldn’t read that file"); }
  }
});

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e2) { ok = false; } ta.remove(); return ok; }
}
// keyboard answering during a quiz (laptop)
document.addEventListener("keydown", e => {
  const q = state.activeQuiz; if (!q || ui.tab !== "tests" || ui.sheet || e.target.matches("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), pick = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  if (pick >= 0) { A.qpick({ dataset: { i: pick } }); e.preventDefault(); }
  else if (e.key === "ArrowRight" || e.key === "Enter") { if (q.idx < q.qids.length - 1) A.qgo({ dataset: { i: q.idx + 1 } }); else A.qsubmit(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { A.qgo({ dataset: { i: q.idx - 1 } }); e.preventDefault(); }
});

/* ================= reset: clear progress, keep the question sets ================= */
function resetCounts() {
  return { sets: state.qsets.length, qs: state.qbank.length, done: Object.values(state.st).filter(s => s.s === "done").length, mocks: state.mocks.length, quizzes: state.quizzes.length,
    wrong: wrongQs().length, mistakes: state.mistakes.filter(m => m.retries.length || m.reason !== (m.res === "S" ? "skipped" : "?") || m.fix || m.src !== "paper").length };
}
function resetSheet() {
  const c = resetCounts();
  sheet(`<h2 id="sh">Reset your progress?</h2><p class="lead">Your question sets and questions stay. Everything you did with them, and in the plan, is cleared.</p>
    <div class="resetbox keep"><b>Kept</b><p>${plural(c.sets, "question set")} with ${plural(c.qs, "question")}, ready to take again from scratch.</p></div>
    <div class="resetbox gone"><b>Cleared</b><ul>
      <li>${plural(c.done, "ticked task")}, day sizes, check-ins and tasks you added</li>
      <li>${plural(c.quizzes, "quiz attempt")}, their scores, and ${plural(c.wrong, "wrong answer")} waiting for a retry</li>
      <li>${plural(c.mocks, "mock score")}</li>
      <li>Your mistake log notes and retries (your CGL 2026 paper mistakes come back fresh)</li>
      <li>The revision queue, syllabus ticks and change history</li></ul></div>
    <label class="check"><input type="checkbox" id="r-settings" checked><span>Also reset the start date, plan length, breaks and exam date</span></label>
    <p class="small soft" style="margin:0 6px 4px">A copy is saved first, so you can undo this from Settings straight after.</p>
    <div class="acts"><button class="btn line" data-a="export">Export a backup first</button><button class="btn dangerfill" data-a="doreset">Reset progress</button></div>`);
}
function resetKeepQuestions(resetSettings) {
  snapshot("Reset of all progress");
  const fresh = defaultState();
  const qbank = state.qbank.map(q => { const { lastA, ...rest } = q; return { ...rest, a: 0, c: 0, last: null, lastAt: null }; });
  state = { ...fresh, qsets: state.qsets, qbank, settings: resetSettings ? fresh.settings : state.settings, backup: state.backup,
    log: [{ at: new Date().toISOString(), what: "Progress reset", why: `Kept ${plural(qbank.length, "question")}` }] };
  stopTimer(); lastTick = 0; clearCaches();
  ui.sel = defaultSel(); ui.quizResult = null; ui.tv = { page: "home" }; ui.weekView = null; ui.more = {}; ui.det = {};
}
Object.assign(A, {
  more: el => { (ui.more ||= {})[el.dataset.k] = !(ui.more[el.dataset.k]); render(); },
  gomistakes: () => { closeSheet(); ui.tab = "review"; ui.mF = "open"; window.scrollTo(0, 0); render(); },
  resetsheet: () => resetSheet(),
  doreset: () => { const rs = document.getElementById("r-settings").checked; resetKeepQuestions(rs); closeSheet(); toast("Progress reset. Your questions are kept"); commit(); }
});
// live score in the mock form
document.addEventListener("input", e => {
  if (!e.target.closest || !e.target.closest(".mockgrid")) return;
  const el = document.getElementById("k-live"); if (!el) return;
  const type = (document.getElementById("k-type") || {}).value || "t1", sec = {};
  for (const k of SECS) { const c = V(`k-${k}-c`), w = V(`k-${k}-w`); if (c !== "" || w !== "") sec[k] = { c: +c || 0, w: +w || 0 }; }
  const s = mockScore({ type, sec }); el.innerHTML = Object.keys(sec).length ? `Score <b class="num">${s.score}</b> of ${s.max}, ${s.c} right, ${s.w} wrong, ${s.sk} skipped` : "Fill in the sections you took";
});
